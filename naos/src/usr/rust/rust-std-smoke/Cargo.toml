[package]
name = "rust-smoke-suite"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "rust-smoke-suite"
path = "src/main.rs"
test = false
bench = false

[dependencies]
byteorder = "1.5"
naos-idl = { path = "../naos-idl" }
naos-sys = { path = "../naos-sys" }
servicekit = { path = "../servicekit" }
tokio = { version = "1.47", default-features = false, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
